<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a6fd8">
<title>Radar de Passagens</title>
<style>
  :root {
    color-scheme: light;
    --plane: #f2f6fb; --surface: #ffffff; --ink: #12263a; --ink-2: #51606f; --muted: #8794a1;
    --grid: #e6ecf2; --axis: #c9d3dd; --border: #e1e8ef;
    --sky-1: #0a6fd8; --sky-2: #14b3c8; --brand: #0a6fd8; --brand-soft: #e8f2fd;
    --sun: #ffb703; --sun-soft: #fff6dc; --sun-ink: #5c4300;
    --s-latam: #2a78d6; --s-azul: #eb6834; --s-gol: #1baf7a;
    --good: #0ca30c; --good-text: #006300; --critical: #d03b3b;
    --shadow: 0 1px 2px rgba(18,38,58,.05), 0 8px 24px rgba(18,38,58,.07);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--plane); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; }
  .demo { background: var(--critical); color: #fff; padding: 8px 16px; text-align: center; font-weight: 600; }

  .hero { background: linear-gradient(120deg, var(--sky-1), var(--sky-2)); color: #fff; padding: 20px 16px 84px; }
  .hero-in, main { max-width: 1040px; margin: 0 auto; }
  .brand { font-weight: 700; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  .route { display: flex; align-items: center; gap: 20px; margin-top: 28px; }
  .route .code { display: block; font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: .02em; }
  .route .city { display: block; opacity: .92; margin-top: 4px; }
  .route .path { flex: 1; max-width: 260px; display: flex; align-items: center; gap: 8px; }
  .route .path::before, .route .path::after { content: ""; flex: 1; border-top: 2px dashed rgba(255,255,255,.65); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .chip { background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.28); border-radius: 99px; padding: 4px 12px; font-size: 13px; }

  main { padding: 0 16px 56px; margin-top: -60px; }
  .datas + .card { margin-top: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin-top: 16px; box-shadow: var(--shadow); }
  h2 { font-size: 17px; margin: 0 0 4px; }
  .hint { color: var(--ink-2); font-size: 13px; margin: 0 0 14px; }
  .muted { color: var(--ink-2); }
  .small { font-size: 13px; }

  .deal { display: flex; gap: 24px; align-items: center; justify-content: space-between; margin-top: 0; }
  .tag { display: inline-block; background: var(--sun); color: var(--sun-ink); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; text-transform: uppercase; letter-spacing: .04em; }
  .deal .lead { font-size: 18px; font-weight: 600; margin: 10px 0 0; }
  .deal .why { margin: 8px 0 0; }
  .deal-price { text-align: right; flex: none; }
  .deal-price .num { font-size: 44px; font-weight: 800; line-height: 1.05; }
  .btn { display: inline-block; background: var(--brand); color: #fff; font: inherit; font-weight: 600; text-decoration: none; padding: 10px 18px; border: 0; border-radius: 10px; margin-top: 12px; cursor: pointer; }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: var(--brand-soft); color: var(--brand); padding: 7px 14px; margin-top: 0; font-size: 14px; }

  .datas { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .data { text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; cursor: pointer; box-shadow: var(--shadow); }
  .data > span { display: block; color: var(--ink-2); }
  .data b { font-size: 20px; font-weight: 800; }
  .data.sel { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand) inset, var(--shadow); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .fare { position: relative; border: 1px solid var(--border); border-radius: 14px; padding: 16px; background: var(--surface); }
  .fare.best { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; background: var(--brand-soft); }
  .fare .name { font-weight: 600; }
  .fare .total { display: block; font-size: 26px; font-weight: 800; margin: 2px 0; }
  .fare .tag { position: absolute; top: -10px; right: 12px; }
  .callout { background: var(--sun-soft); border-radius: 12px; padding: 12px 14px; margin: 14px 0 0; }

  .flight { display: grid; grid-template-columns: minmax(200px, 1.3fr) repeat(3, minmax(84px, .6fr)) minmax(150px, 1fr) auto; gap: 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--grid); }
  .flight.first { border-top: 0; padding-top: 0; }
  .cia { display: flex; align-items: center; gap: 12px; }
  .cia .small { display: block; }
  .logo { width: 40px; height: 40px; border-radius: 12px; color: #fff; font-weight: 800; font-size: 13px; display: grid; place-items: center; flex: none; }
  .kv span { display: block; color: var(--ink-2); font-size: 12px; }
  .kv b { font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; margin-left: 6px; }

  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { background: var(--plane); border-radius: 12px; padding: 14px 16px; }
  .tile span { display: block; color: var(--ink-2); font-size: 13px; }
  .tile b { font-size: 24px; font-weight: 800; display: block; }
  .data > span + b + span { margin-top: 0; }

  .goal .bar { height: 8px; border-radius: 99px; background: var(--grid); margin: 10px 0 8px; overflow: hidden; }
  .goal .bar i { display: block; height: 100%; border-radius: 99px; background: var(--brand); }
  .goal.hit .bar i { background: var(--good); }
  .ok { color: var(--good-text); font-weight: 700; }
  .cfg { margin-top: 16px; }
  .cfg-form { background: var(--plane); border-radius: 12px; padding: 16px; }
  .cfg-form label { display: block; font-size: 13px; color: var(--ink-2); }
  .cfg-form .campo { display: flex; align-items: center; gap: 6px; margin-top: 4px; color: var(--ink); font-weight: 600; }
  .cfg-form input { width: 100%; font: inherit; font-weight: 600; color: var(--ink); padding: 8px 10px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface); }
  .cfg-form input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .cfg-acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
  .cfg-acoes .btn { margin-top: 0; }
  .erro { color: var(--critical); font-weight: 600; }

  .key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--ink-2); font-size: 13px; margin-bottom: 4px; }
  .legend .dash { display: inline-block; width: 16px; border-top: 2px dashed var(--muted); margin-right: 6px; vertical-align: middle; }
  #chart { position: relative; }
  #chart svg { display: block; width: 100%; height: auto; }
  #chart text { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 13px; box-shadow: var(--shadow); white-space: nowrap; display: none; }
  details summary { cursor: pointer; color: var(--ink-2); margin-top: 12px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 600; font-size: 13px; }
  td.num, th.num { text-align: right; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 24px; }

  @media (max-width: 820px) {
    .flight { grid-template-columns: 1fr 1fr 1fr; }
    .flight .cia, .flight .best-col, .flight .go { grid-column: 1 / -1; }
    .flight .vazio { display: none; }
    .flight .go { justify-self: start; }
  }
  @media (max-width: 640px) {
    .grid3, .two { grid-template-columns: 1fr; }
    .deal { flex-direction: column; align-items: flex-start; }
    .deal-price { text-align: left; }
    .deal-price .num { font-size: 36px; }
    .route .code { font-size: 34px; }
    .route { gap: 12px; }
  }
</style>
</head>
<body>
<div id="demo" class="demo" hidden>DADOS DE DEMONSTRAÇÃO — preços fictícios, só para ver o painel funcionando</div>
<header class="hero">
  <div class="hero-in">
    <div class="brand"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>Radar de passagens</div>
    <div class="route">
      <div><span class="code" id="cod-origem">···</span><span class="city" id="nome-origem">&nbsp;</span></div>
      <div class="path"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(90deg)" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></div>
      <div><span class="code" id="cod-destino">···</span><span class="city" id="nome-destino">&nbsp;</span></div>
    </div>
    <div class="chips" id="chips"><span class="chip">Carregando…</span></div>
  </div>
</header>
<main>
  <div id="app"></div>
  <footer>Preços do Google Voos, coletados todo dia às 7h. Confira no site da companhia antes de comprar.</footer>
</main>

<script type="module">
const demo = new URLSearchParams(location.search).has('demo') || !!window.__DEMO__;
const brl = (v) => v == null ? '—' : Math.round(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dataCurta = (iso) => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const dia = (ymd) => new Date(ymd + 'T12:00:00').toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });
const CIAS = ['LATAM', 'Azul', 'GOL'];
const COR = { LATAM: 'var(--s-latam)', Azul: 'var(--s-azul)', GOL: 'var(--s-gol)' };
const NIVEL = { low: 'baixo', typical: 'dentro do normal', high: 'alto' };
const METAS = [['porPessoa', '1 passagem'], ['duasPessoas', '2 passagens na mesma reserva'], ['quatroPessoas', 'As 4 passagens']];
const NPAX = { porPessoa: 1, duasPessoas: 2, quatroPessoas: 4 };
const FB = 'https://www.gstatic.com/firebasejs/10.14.1';
const melhorTotal = (c) => Math.min(...c.analise.estrategias.map((e) => e.total));

let fb = null;       // { app, db, fs } depois de carregar o Firebase
let au = null;       // módulo de autenticação
let auth = null;
let dados = null;    // último { config, ajustes, snapshots } carregado
let formAberto = false;
let idaSel = null;  // data de ida escolhida no seletor
let hist = [];      // coletas da data escolhida (para o gráfico)

// Coletas antigas tinham uma só data de ida; as novas trazem { datas: { ida: ... } }.
const datasDe = (x) => x.datas ?? { [x.ida]: x };
const diaMes = (ymd) => `${+ymd.slice(8)}/${ymd.slice(5, 7)}`;

async function carrega() {
  if (demo) {
    document.getElementById('demo').hidden = false;
    return window.__DEMO__ ?? (await fetch('./demo.json')).json();
  }
  const { initializeApp } = await import(`${FB}/firebase-app.js`);
  const fs = await import(`${FB}/firebase-firestore-lite.js`);
  const { firebaseConfig } = await import('./firebase-config.js');
  const app = initializeApp(firebaseConfig);
  const db = fs.getFirestore(app);
  fb = { app, db, fs };
  const [cfg, aj, snaps] = await Promise.all([
    fs.getDoc(fs.doc(db, 'meta/config')),
    fs.getDoc(fs.doc(db, 'ajustes/alertas')),
    fs.getDocs(fs.query(fs.collection(db, 'snapshots'), fs.orderBy('ts', 'desc'), fs.limit(400))),
  ]);
  return { config: cfg.data() ?? null, ajustes: aj.data() ?? null, snapshots: snaps.docs.map((d) => d.data()).reverse() };
}

function links(cfg) {
  const { origem: o, destino: d, ida, volta, passageiros: n } = cfg;
  const [ai, mi, di] = ida.split('-'), [av, mv, dv] = volta.split('-');
  return [
    ['Google Voos', `https://www.google.com/travel/flights?hl=pt-BR&curr=BRL&q=${encodeURIComponent(`voos de ${o} para ${d} em ${ida} volta ${volta} ${n} adultos`)}`],
    ['Skyscanner', `https://www.skyscanner.com.br/transporte/passagens-aereas/${o.toLowerCase()}/${d.toLowerCase()}/${ai.slice(2)}${mi}${di}/${av.slice(2)}${mv}${dv}/?adultsv2=${n}`],
    ['LATAM', `https://www.latamairlines.com/br/pt/oferta-voos?origin=${o}&destination=${d}&outbound=${ida}T12%3A00%3A00.000Z&inbound=${volta}T12%3A00%3A00.000Z&adt=${n}&chd=0&inf=0&trip=RT&cabin=Economy&redemption=false&sort=RECOMMENDED`],
    ['Azul', `https://www.voeazul.com.br/br/pt/home/selecao-voo?c[0].ds=${o}&c[0].std=${mi}/${di}/${ai}&c[0].as=${d}&c[1].ds=${d}&c[1].std=${mv}/${dv}/${av}&c[1].as=${o}&p[0].t=ADT&p[0].c=${n}&p[0].cp=false&f.dl=3&f.dr=3&cc=BRL`],
    ['GOL', `https://b2c.voegol.com.br/compra/busca-parceiros?pv=br&tipo=DF&de=${o}&para=${d}&ida=${di}-${mi}-${ai}&volta=${dv}-${mv}-${av}&ADT=${n}&CHD=0&INF=0`],
  ];
}

function veredito(s) {
  const c = s.cias[s.melhorCia], a = c.analise;
  const e = a.estrategias.find((x) => x.id === a.melhor);
  const p4 = c.ofertas[4].preco;
  if (e.id === 'quatro') {
    return { e, frase: `Hoje o melhor é comprar as 4 de uma vez, na ${esc(s.melhorCia)}.`, porque: a.estrategias.length > 1 ? 'Dividir a compra em reservas separadas não baixa o preço deste voo hoje; só separa os localizadores.' : 'Este voo só apareceu na busca para 4 adultos; confira o preço no site da companhia.' };
  }
  const forma = e.id === 'um-a-um' ? 'uma passagem por reserva (4 reservas seguidas)' : 'em duas reservas de 2 passagens, uma logo após a outra';
  const eco = a.economiaDividindo;
  if (eco < p4 * 0.03) {
    return { e, frase: `Hoje dividir a compra sai um pouco mais barato na ${esc(s.melhorCia)}: ${forma}.`, porque: `A diferença para a reserva única de 4 (${brl(p4)}) é pequena: ${brl(eco)}. Com as 4 na mesma reserva, todos ficam no mesmo localizador.` };
  }
  return { e, frase: `Hoje compensa dividir a compra: ${forma}, na ${esc(s.melhorCia)}.`, porque: `A tarifa mais barata desse voo tem menos de 4 lugares. Numa reserva única (${brl(p4)}) os 4 pagam a tarifa seguinte; dividindo, quem cabe na tarifa barata paga menos. Economia estimada: ${brl(eco)}.` };
}

function tendencia(snaps) {
  const serie = snaps.filter((s) => s.melhorCia).map((s) => ({ ts: s.ts, v: melhorTotal(s.cias[s.melhorCia]) / 4 }));
  if (serie.length < 2) return null;
  const a = serie[0], b = serie[serie.length - 1];
  return { desde: a.ts, dif: b.v - a.v, pct: (b.v - a.v) / a.v, min: Math.min(...serie.map((p) => p.v)), atual: b.v };
}

// Metas em vigor: as do config.json, sobrepostas pelas salvas no painel.
function metasAtuais(d) {
  const al = { ...d.config.alertas };
  for (const [k] of METAS) if (Number.isFinite(d.ajustes?.[k])) al[k] = d.ajustes[k];
  return al;
}

function render(d) {
  dados = d;
  const { config, snapshots } = d;
  const app = document.getElementById('app');
  if (!config || !snapshots.length) {
    document.getElementById('chips').innerHTML = '<span class="chip">Aguardando a primeira coleta de preços</span>';
    app.innerHTML = '<div class="card"><h2>Ainda não há preços coletados</h2><p class="muted" style="margin:0">O robô checa todo dia às 7h e os dados aparecem aqui.</p></div>';
    return;
  }
  const coleta = snapshots[snapshots.length - 1];
  const datas = datasDe(coleta);
  const idas = Object.keys(datas).sort();
  // Data em destaque: a de menor preço por pessoa no plano recomendado
  // (as 4 de uma vez quando a oferta para 4 é boa; senão, a dupla mais barata).
  const meta4 = metasAtuais(d).quatroPessoas;
  const plano = (x) => {
    const t4 = x.melhorCia ? melhorTotal(x.cias[x.melhorCia]) : null;
    const par = x.dividir?.agora?.preco ?? null;
    const bom4 = t4 != null && (par == null || t4 <= meta4 || t4 / 4 <= par / 2 + 25);
    return { bom4, porPessoa: bom4 ? t4 / 4 : par == null ? Infinity : par / 2 };
  };
  const idaPar = idas.reduce((m, i) => (!m || plano(datas[i]).porPessoa < plano(datas[m]).porPessoa ? i : m), null);
  if (!datas[idaSel]) idaSel = idaPar ?? coleta.melhorIda ?? idas.find((i) => datas[i].melhorCia) ?? idas[0];
  const s = datas[idaSel];
  // Histórico: a última coleta de cada dia.
  const porDia = new Map();
  for (const x of snapshots.map((y) => datasDe(y)[idaSel]).filter((y) => y?.melhorCia)) porDia.set(new Date(x.ts).toDateString(), x);
  hist = [...porDia.values()];
  const cfgIda = { ...config, ida: idaSel };
  const al = metasAtuais(d);
  document.title = `Passagens ${config.origemNome} → ${config.destinoNome}`;
  document.getElementById('cod-origem').textContent = config.origem;
  document.getElementById('cod-destino').textContent = config.destino;
  document.getElementById('nome-origem').textContent = config.origemNome;
  document.getElementById('nome-destino').textContent = config.destinoNome;
  document.getElementById('chips').innerHTML = [`Ida ${idas.map((i) => +i.slice(8)).join(' ou ')} de ${dia(idas[0]).split(' de ')[1]}`, `Volta ${dia(config.volta)}`, `${config.passageiros} adultos`, 'Ida e volta, com taxas', `Atualizado em ${dataCurta(coleta.ts)}`]
    .map((c) => `<span class="chip">${esc(c)}</span>`).join('');

  const v = veredito(s);
  const a = s.cias[s.melhorCia].analise;
  const voo = s.cias[s.melhorCia].ofertas[4];
  const t = tendencia(hist);
  const site = Object.fromEntries(links(cfgIda));
  // Para os alertas vale o menor preço entre as datas de ida.
  const menor = (lista) => lista.filter((o) => o?.preco != null).reduce((m, o) => (!m || o.preco < m.preco ? o : m), null);
  const porData = (f) => menor(idas.filter((i) => datas[i].melhorCia).map((i) => ({ ...f(datas[i]), ida: i })));
  const agora = {
    porPessoa: porData((x) => x.minimos[1]),
    duasPessoas: porData((x) => x.minimos[2]),
    quatroPessoas: porData((x) => ({ preco: melhorTotal(x.cias[x.melhorCia]), cia: x.melhorCia, saida: x.cias[x.melhorCia].ofertas[4]?.saida })),
  };
  const seletor = idas.length < 2 ? '' : `<div class="datas" role="tablist" aria-label="Data de saída">${idas.map((i) => {
    const x = datas[i];
    const total = x.melhorCia ? melhorTotal(x.cias[x.melhorCia]) : null;
    return `<button class="data ${i === idaSel ? 'sel' : ''}" role="tab" aria-selected="${i === idaSel}" data-ida="${i}" type="button">
      <span class="small">Saída ${dia(i)}${i === (idaPar ?? coleta.melhorIda) ? '<span class="pill">mais barata</span>' : ''}</span>
      <b>${plano(x).bom4 || !x.dividir?.agora ? (total == null ? 'sem preço' : `4 por ${brl(total)}`) : `2 por ${brl(x.dividir.agora.preco)}`}</b>
      ${x.dividir?.agora ? `<span class="small">${plano(x).bom4 ? `2 por ${brl(x.dividir.agora.preco)}` : `4 por ${brl(total)}`}</span>` : ''}</button>`;
  }).join('')}</div>`;
  const g = s.google ?? {};
  const hora = (o) => esc(o?.saida?.slice(11) ?? '');
  const dv = s.dividir;
  const sep = [s.misto, dv?.agora && dv.restantes && !dv.restantes.mesmoVoo ? { total: dv.agora.preco + dv.restantes.preco, partes: [dv.agora, dv.restantes] } : null]
    .filter(Boolean).reduce((m, o) => (!m || o.total < m.total ? o : m), null);
  // Coletas antigas não trazem "dividir": usa os valores do voo recomendado.
  const div = s.dividir ?? { agora: { preco: a.doisAgora }, restantes: { preco: a.doisRestantesHoje } };

  const linkCia = (cia, ida, n) => { const m = Object.fromEntries(links({ ...config, ida, passageiros: n })); return m[cia] ?? m['Google Voos']; };
  const vooTxt = (o) => `Saída ${diaMes(idaSel)} às ${hora(o)}${o.via?.length ? ` · conexão em ${esc(o.via.join(', '))}` : ''}${o.voos?.length ? ` · ${esc(o.voos.join(' + '))}` : ''}`;
  // Preferência: comprar 2 agora e 2 depois — a não ser que a oferta para as 4 seja boa
  // (dentro da meta das 4, ou tão barata por pessoa quanto a dupla mais barata).
  const par = s.dividir?.agora;
  const bom4 = plano(s).bom4;
  const heroi = bom4 ? `
    <section class="card deal">
      <div>
        <span class="tag">${par ? 'Oferta boa para as 4' : 'Melhor opção hoje'}</span>
        <p class="lead">${v.frase}</p>
        ${par ? `<p style="margin:6px 0 0">Por pessoa sai ${brl(v.e.porPessoa)}, contra ${brl(par.preco / 2)} na dupla mais barata (${esc(par.cia)}, ${hora(par)}).</p>` : ''}
        <p class="muted" style="margin:6px 0 0">${vooTxt(voo)}</p>
        <p class="muted small why">${v.porque}</p>
      </div>
      <div class="deal-price">
        <div class="num">${brl(v.e.total)}</div>
        <div class="muted">${brl(v.e.porPessoa)} por pessoa · 4 passagens</div>
        <a class="btn" href="${esc(linkCia(s.melhorCia, idaSel, 4))}" target="_blank" rel="noopener">Abrir na ${esc(s.melhorCia)} ↗</a>
      </div>
    </section>` : `
    <section class="card deal">
      <div>
        <span class="tag">Plano: 2 agora + 2 depois</span>
        <p class="lead">${par.preco <= al.duasPessoas ? `Compre 2 agora na ${esc(par.cia)}: está dentro da sua meta.` : `A dupla mais barata hoje está na ${esc(par.cia)}, ainda acima da sua meta de ${brl(al.duasPessoas)}.`}</p>
        <p class="muted" style="margin:6px 0 0">${vooTxt(par)}</p>
        <p class="muted small why">Para as 4 de uma vez, o melhor hoje é ${brl(v.e.total)} na ${esc(s.melhorCia)} (${brl(v.e.porPessoa)} por pessoa), ${v.e.total <= al.quatroPessoas ? 'dentro' : 'acima'} da meta de ${brl(al.quatroPessoas)}.</p>
      </div>
      <div class="deal-price">
        <div class="num">${brl(par.preco)}</div>
        <div class="muted">${brl(par.preco / 2)} por pessoa · 2 passagens</div>
        <a class="btn" href="${esc(linkCia(par.cia, idaSel, 2))}" target="_blank" rel="noopener">Abrir na ${esc(par.cia)} ↗</a>
      </div>
    </section>`;
  const blocoDividir = `
    <section class="card">
      <h2>O plano 2 agora + 2 depois</h2>
      <p class="hint">Só sai mais barato se o preço cair até lá. Perto da data, o risco é de alta e de o voo lotar.</p>
      <div class="two">
        <div class="tile"><span>Paga agora pelas 2 mais baratas</span><b>${brl(div.agora?.preco)}</b><span>${div.agora?.cia ? `${esc(div.agora.cia)}, saída ${hora(div.agora)} · <a href="${esc(linkCia(div.agora.cia, idaSel, 2))}" target="_blank" rel="noopener">abrir ↗</a>` : '&nbsp;'}</span></div>
        <div class="tile"><span>As outras 2, a preço de hoje</span><b>${brl(div.restantes?.preco)}</b><span>${div.restantes?.cia ? `${div.restantes.mesmoVoo ? 'No mesmo voo' : `Em outro voo: ${esc(div.restantes.cia)}, saída ${hora(div.restantes)}`}` : '&nbsp;'}</span></div>
      </div>
      <p class="muted" style="margin:12px 0 0">${t
        ? `Desde ${dataCurta(t.desde)}, o preço por pessoa das 4 juntas ${Math.abs(t.dif) < 1 ? 'ficou estável' : `${t.dif > 0 ? 'subiu' : 'caiu'} ${brl(Math.abs(t.dif))} (${(Math.abs(t.pct) * 100).toFixed(1).replace('.', ',')}%)`}. Menor valor visto: ${brl(t.min)}.`
        : 'Ainda não há histórico suficiente para mostrar a tendência.'}
        ${g.nivel ? ` O Google Voos classifica o preço atual como <b>${NIVEL[g.nivel] ?? esc(g.nivel)}</b>${g.faixaTipica ? ` (faixa típica: ${brl(g.faixaTipica[0])} a ${brl(g.faixaTipica[1])} por pessoa)` : ''}.` : ''}</p>
    </section>`;

  app.innerHTML = `${seletor}
    ${heroi}

    ${blocoDividir}

    <section class="card">
      <h2>Formas de comprar as 4 passagens</h2>
      <p class="hint">${esc(s.melhorCia)}, todos no mesmo voo. ${a.estrategias.length > 1 ? '"2 + 2" e "1 por 1" são reservas feitas em sequência, no mesmo dia.' : 'Este voo não apareceu nas buscas de 1 e 2 adultos, então só há o preço da reserva de 4.'}</p>
      <div class="grid3">
        ${a.estrategias.map((e) => `
          <div class="fare ${e.id === v.e.id ? 'best' : ''}">
            ${e.id === v.e.id ? '<span class="tag">Melhor hoje</span>' : ''}
            <span class="name">${esc(e.nome)}</span>
            <b class="total">${brl(e.total)}</b>
            <span class="muted small">${brl(e.porPessoa)} por pessoa · ${e.reservas} reserva${e.reservas > 1 ? 's' : ''}${e.total > v.e.total ? `<br>${brl(e.total - v.e.total)} a mais` : ''}</span>
          </div>`).join('')}
      </div>
      ${sep && sep.total < v.e.total - 50 ? `<p class="callout"><b>Topam ir em voos separados?</b> 2 na ${esc(sep.partes[0].cia)} (${brl(sep.partes[0].preco)}, saída ${hora(sep.partes[0])}) + 2 na ${esc(sep.partes[1].cia)} (${brl(sep.partes[1].preco)}, saída ${hora(sep.partes[1])}) = <b>${brl(sep.total)}</b>, ${brl(v.e.total - sep.total)} a menos.</p>` : ''}
      <p class="muted small" style="margin:12px 0 0">Valores estimados a partir do preço de 1, 2 e 4 adultos. O valor final é o do site da companhia.</p>
    </section>

    <section class="card">
      <h2>Voos por companhia</h2>
      <p class="hint">O voo de cada companhia em que as 4 passagens saem mais barato. Preço total da reserva para 1, 2 e 4 adultos nesse voo.</p>
      ${CIAS.map((cia, i) => {
        const c = s.cias[cia];
        const logo = `<span class="logo" style="background:${COR[cia]}">${cia.slice(0, 2).toUpperCase()}</span>`;
        const botao = `<a class="btn ghost go" href="${esc(site[cia])}" target="_blank" rel="noopener">Abrir site ↗</a>`;
        const cls = `flight${i === 0 ? ' first' : ''}`;
        if (!c) return `<div class="${cls}"><div class="cia">${logo}<div><b>${cia}</b><span class="muted small">Sem preço para 4 adultos no Google Voos nesta coleta</span></div></div>${'<div class="vazio"></div>'.repeat(4)}${botao}</div>`;
        const m = c.analise.estrategias.find((e) => e.id === c.analise.melhor);
        const o = c.ofertas;
        return `<div class="${cls}">
          <div class="cia">${logo}<div><b>${cia}${cia === s.melhorCia ? '<span class="pill">mais barata</span>' : ''}</b>
            <span class="muted small">Saída ${hora(o[4])} · ${o[4].paradas} parada${o[4].paradas === 1 ? '' : 's'}${o[4].via?.length ? ` (${esc(o[4].via.join(', '))})` : ''}</span></div></div>
          <div class="kv"><span>1 adulto</span><b>${brl(o[1]?.preco)}</b></div>
          <div class="kv"><span>2 adultos</span><b>${brl(o[2]?.preco)}</b></div>
          <div class="kv"><span>4 adultos</span><b>${brl(o[4].preco)}</b></div>
          <div class="kv best-col"><span>Melhor total para 4 · ${esc(m.nome)}</span><b style="font-size:18px">${brl(m.total)}</b></div>
          ${botao}</div>`;
      }).join('')}
    </section>

    <section class="card">
      <h2>Alertas por e-mail</h2>
      <p class="hint">Você recebe um e-mail quando o preço chegar à meta.</p>
      <div class="grid3">
        ${METAS.map(([k, rot]) => {
          const of = agora[k], lim = al[k];
          const ok = of?.preco != null && of.preco <= lim;
          return `<div class="fare goal ${ok ? 'hit' : ''}">
            <span class="name">${rot}</span>
            <span class="muted small" style="display:block">Meta: ${brl(lim)}</span>
            <div class="bar"><i style="width:${of?.preco ? Math.min(100, Math.round((lim / of.preco) * 100)) : 0}%"></i></div>
            <span class="small">${ok ? '<span class="ok">✓ Meta atingida</span> · ' : ''}Hoje: <b>${brl(of?.preco)}</b>${of?.cia ? ` ${esc(of.cia)}` : ''}${of?.ida ? `, saída ${diaMes(of.ida)}${of.saida ? ` às ${esc(of.saida.slice(11))}` : ''}` : ''}${!ok && of?.preco != null ? ` · faltam ${brl(of.preco - lim)}` : ''}</span>
            ${of?.cia ? `<div style="margin-top:10px"><a class="btn ghost" href="${esc(linkCia(of.cia, of.ida, NPAX[k]))}" target="_blank" rel="noopener">Abrir na ${esc(of.cia)} ↗</a></div>` : ''}
          </div>`;
        }).join('')}
      </div>
      <div class="cfg" id="cfg"></div>
    </section>

    <section class="card">
      <h2>Histórico do preço por pessoa</h2>
      <p class="hint">Saída ${dia(idaSel)}. As 4 passagens na melhor forma de comprar, por companhia.</p>
      <div class="legend">${CIAS.map((c) => `<span><span class="key" style="background:${COR[c]}"></span>${c}</span>`).join('')}<span><span class="dash"></span>meta ${brl(al.porPessoa)}</span></div>
      <div id="chart"><div class="tip" id="tip"></div></div>
      <details><summary>Ver em tabela</summary><div class="scroll"><table>
        <thead><tr><th>Coleta</th>${CIAS.map((c) => `<th class="num">${c}</th>`).join('')}</tr></thead>
        <tbody>${[...hist].reverse().map((x) => `<tr><td>${dataCurta(x.ts)}</td>${CIAS.map((c) => `<td class="num">${x.cias[c] ? brl(melhorTotal(x.cias[c]) / 4) : '—'}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div></details>
    </section>

    <section class="card">
      <h2>Conferir antes de comprar</h2>
      <p class="hint">Se o link não abrir com a busca preenchida, informe ${esc(config.origem)} → ${esc(config.destino)}, ${dia(idaSel)} a ${dia(config.volta)}.</p>
      <div class="links">${links(cfgIda).map(([n, u]) => `<a class="btn ghost" href="${esc(u)}" target="_blank" rel="noopener">${n} ↗</a>`).join('')}</div>
    </section>`;

  desenha(hist, al.porPessoa);
  pintaCfg();
  app.querySelectorAll('.data').forEach((b) => b.addEventListener('click', () => { idaSel = b.dataset.ida; render(dados); }));
}

// ---- Configurador das metas (grava em ajustes/alertas; exige login Google autorizado) ----

async function preparaAuth() {
  if (demo || !fb || au) return;
  au = await import(`${FB}/firebase-auth.js`);
  auth = au.getAuth(fb.app);
  au.onAuthStateChanged(auth, () => pintaCfg());
}

function pintaCfg(msg = '') {
  const el = document.getElementById('cfg');
  if (!el || demo || !fb) return;
  const u = auth?.currentUser;
  const conta = u ? `<span class="muted small">Conectado como ${esc(u.email)} · <a href="#" id="cfg-sair">sair</a></span>` : '';
  if (!formAberto) {
    el.innerHTML = `<div class="cfg-acoes"><button class="btn ghost" id="cfg-abrir" type="button">Alterar metas</button>${conta}${msg ? `<span class="small erro">${esc(msg)}</span>` : ''}</div>`;
    el.querySelector('#cfg-abrir').addEventListener('click', abreCfg);
  } else {
    const al = metasAtuais(dados);
    el.innerHTML = `<form class="cfg-form" id="cfg-form">
      <div class="grid3">${METAS.map(([k, rot]) => `<label>${rot}<span class="campo">R$ <input type="number" name="${k}" min="100" max="100000" step="10" required value="${al[k]}"></span></label>`).join('')}</div>
      <div class="cfg-acoes"><button class="btn" type="submit">Salvar metas</button><button class="btn ghost" type="button" id="cfg-cancelar">Cancelar</button>${conta}</div>
      <p class="small ${msg ? 'erro' : 'muted'}" style="margin:10px 0 0">${msg ? esc(msg) : 'As novas metas valem a partir da próxima checagem (todo dia às 7h).'}</p>
    </form>`;
    el.querySelector('#cfg-form').addEventListener('submit', salvaCfg);
    el.querySelector('#cfg-cancelar').addEventListener('click', () => { formAberto = false; pintaCfg(); });
  }
  el.querySelector('#cfg-sair')?.addEventListener('click', async (ev) => { ev.preventDefault(); formAberto = false; await au.signOut(auth); });
}

async function abreCfg() {
  try {
    await preparaAuth();
    if (!auth.currentUser) await au.signInWithPopup(auth, new au.GoogleAuthProvider());
    formAberto = true;
    pintaCfg();
  } catch (e) {
    console.error(e);
    const fechou = /popup-closed|cancelled-popup/.test(e.code ?? '');
    pintaCfg(fechou ? '' : 'Não foi possível entrar com o Google. Libere pop-ups para este site e tente de novo.');
  }
}

async function salvaCfg(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const novo = { atualizadoPor: auth.currentUser.email, atualizadoEm: new Date().toISOString() };
  for (const [k] of METAS) novo[k] = Number(f.get(k));
  try {
    await fb.fs.setDoc(fb.fs.doc(fb.db, 'ajustes/alertas'), novo);
    formAberto = false;
    render({ ...dados, ajustes: novo });
  } catch (e) {
    console.error(e);
    pintaCfg(e.code === 'permission-denied' ? 'Esta conta Google não tem permissão para alterar as metas.' : 'Não foi possível salvar. Tente de novo.');
  }
}

function desenha(snaps, meta) {
  const box = document.getElementById('chart');
  const tip = document.getElementById('tip');
  box.querySelector('svg')?.remove();
  const W = Math.max(320, box.clientWidth), H = 300, m = { t: 12, r: 64, b: 28, l: 60 };
  const pts = snaps.map((s) => ({ t: +new Date(s.ts), ts: s.ts, v: Object.fromEntries(CIAS.map((c) => [c, s.cias[c] ? melhorTotal(s.cias[c]) / 4 : null])) }));
  const vals = pts.flatMap((p) => Object.values(p.v)).filter((v) => v != null);
  let lo = Math.min(...vals, meta), hi = Math.max(...vals, meta);
  const passo = [50, 100, 200, 250, 500, 1000].find((p) => (hi - lo) / p <= 5) ?? 2000;
  lo = Math.floor((lo - 1) / passo) * passo; hi = Math.ceil((hi + 1) / passo) * passo;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t === t0 ? t0 + 1 : pts[pts.length - 1].t;
  const x = (t) => m.l + ((t - t0) / (t1 - t0)) * (W - m.l - m.r);
  const y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const ns = 'http://www.w3.org/2000/svg';
  const el = (tag, at, txt) => { const e = document.createElementNS(ns, tag); for (const k in at) e.setAttribute(k, at[k]); if (txt != null) e.textContent = txt; return e; };
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Histórico do preço por pessoa, por companhia' });

  for (let v = lo; v <= hi; v += passo) {
    svg.append(el('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: 'var(--grid)' }));
    svg.append(el('text', { x: m.l - 8, y: y(v) + 4, 'text-anchor': 'end', fill: 'var(--muted)' }, brl(v)));
  }
  const dias = new Set(pts.map((p) => new Date(p.t).toDateString())).size;
  const nTicks = Math.max(1, Math.min(dias, Math.floor((W - m.l - m.r) / 90) + 1));
  for (let i = 0; i < nTicks; i++) {
    const t = nTicks === 1 ? t0 : t0 + ((t1 - t0) * i) / (nTicks - 1);
    svg.append(el('text', { x: x(t), y: H - 8, 'text-anchor': i === 0 ? 'start' : i === nTicks - 1 ? 'end' : 'middle', fill: 'var(--muted)' },
      new Date(t).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })));
  }
  svg.append(el('line', { x1: m.l, x2: W - m.r, y1: y(meta), y2: y(meta), stroke: 'var(--muted)', 'stroke-width': 2, 'stroke-dasharray': '6 5' }));
  svg.append(el('text', { x: W - m.r + 6, y: y(meta) + 4, fill: 'var(--ink-2)' }, 'meta'));

  const rotulos = [];
  for (const c of CIAS) {
    const serie = pts.filter((p) => p.v[c] != null);
    if (!serie.length) continue;
    svg.append(el('path', { d: serie.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p.v[c]).toFixed(1)}`).join(''), fill: 'none', stroke: COR[c], 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    const u = serie[serie.length - 1];
    svg.append(el('circle', { cx: x(u.t), cy: y(u.v[c]), r: 4, fill: COR[c], stroke: 'var(--surface)', 'stroke-width': 2 }));
    rotulos.push({ c, y: y(u.v[c]) });
  }
  // Rótulos no fim das linhas, afastados para não se sobreporem.
  rotulos.sort((a, b) => a.y - b.y);
  for (let i = 1; i < rotulos.length; i++) rotulos[i].y = Math.max(rotulos[i].y, rotulos[i - 1].y + 14);
  rotulos.forEach((r) => { if (Math.abs(r.y - y(meta)) < 14) r.y = y(meta) - 14; });
  for (const r of rotulos) svg.append(el('text', { x: W - m.r + 8, y: r.y + 4, fill: 'var(--ink-2)' }, r.c));

  const guia = el('line', { y1: m.t, y2: H - m.b, stroke: 'var(--axis)', visibility: 'hidden' });
  const marcas = CIAS.map((c) => el('circle', { r: 4, fill: COR[c], stroke: 'var(--surface)', 'stroke-width': 2, visibility: 'hidden' }));
  const alvo = el('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: 'transparent' });
  svg.append(guia, ...marcas, alvo);
  const some = () => { guia.setAttribute('visibility', 'hidden'); marcas.forEach((c) => c.setAttribute('visibility', 'hidden')); tip.style.display = 'none'; };
  const move = (ev) => {
    const r = svg.getBoundingClientRect();
    const px = ((ev.touches?.[0] ?? ev).clientX - r.left) * (W / r.width);
    const p = pts.reduce((a, b) => (Math.abs(x(b.t) - px) < Math.abs(x(a.t) - px) ? b : a));
    guia.setAttribute('x1', x(p.t)); guia.setAttribute('x2', x(p.t)); guia.setAttribute('visibility', 'visible');
    CIAS.forEach((c, i) => {
      if (p.v[c] == null) return marcas[i].setAttribute('visibility', 'hidden');
      marcas[i].setAttribute('cx', x(p.t)); marcas[i].setAttribute('cy', y(p.v[c])); marcas[i].setAttribute('visibility', 'visible');
    });
    tip.innerHTML = `<b>${dataCurta(p.ts)}</b><br>` + CIAS.filter((c) => p.v[c] != null).sort((a, b) => p.v[a] - p.v[b])
      .map((c) => `<span class="key" style="background:${COR[c]}"></span>${c}: <b>${brl(p.v[c])}</b>`).join('<br>');
    tip.style.display = 'block';
    const esq = x(p.t) * (r.width / W);
    tip.style.left = (esq + 12 + tip.offsetWidth > r.width ? esq - 12 - tip.offsetWidth : esq + 12) + 'px';
    tip.style.top = '8px';
  };
  alvo.addEventListener('mousemove', move); alvo.addEventListener('touchstart', move, { passive: true }); alvo.addEventListener('touchmove', move, { passive: true });
  alvo.addEventListener('mouseleave', some);
  box.prepend(svg);
}

let espera;
addEventListener('resize', () => {
  if (!dados?.config || !dados.snapshots.length) return;
  clearTimeout(espera);
  espera = setTimeout(() => desenha(hist, metasAtuais(dados).porPessoa), 150);
});

carrega().then((d) => { render(d); return preparaAuth(); }).catch((e) => {
  console.error(e);
  document.getElementById('chips').innerHTML = '<span class="chip">Não foi possível carregar os preços</span>';
  document.getElementById('app').innerHTML = `<div class="card"><h2>Erro ao carregar os dados</h2><p class="muted" style="margin:0">${esc(e.message)}</p></div>`;
});
</script>
